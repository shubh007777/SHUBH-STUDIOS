<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="#0A0B10" />
  <rect width="512" height="512" rx="128" fill="url(#glow-grad)" />
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Film Reel Notch Accents -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-dasharray="14 10" opacity="0.4" />

  <!-- Core Stylized 'S' + Play Triangle Vector -->
  <g filter="url(#shadow)">
    <!-- Cinematic Stylized Letter S -->
    <path
      d="M320 160 C320 120, 290 96, 256 96 C200 96, 172 136, 172 176 C172 240, 340 248, 340 336 C340 384, 304 416, 256 416 C196 416, 164 368, 164 324"
      fill="none"
      stroke="url(#gold-grad)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Centered Amber Play Arrow / Shutter -->
    <polygon
      points="236,220 296,256 236,292"
      fill="url(#gold-grad)"
    />
  </g>
</svg>
